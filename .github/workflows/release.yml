name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_server: machinebridge-server.exe
            artifact_cli: machinebridge-cli.exe
            release_server: machinebridge-server-windows-x64.exe
            release_cli: machinebridge-cli-windows-x64.exe
          - os: ubuntu-24.04
            artifact_server: machinebridge-server
            artifact_cli: machinebridge-cli
            release_server: machinebridge-server-linux-x64
            release_cli: machinebridge-cli-linux-x64

    steps:
      - name: Checkout machinebridge
        uses: actions/checkout@v4

      - name: Checkout cloudflare-tunnel
        uses: actions/checkout@v4
        with:
          repository: chahakshahcs5/cloudflare-tunnel-cpp
          path: cloudflare-tunnel

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLOUDFLARE_TUNNEL_DIR=${{ github.workspace }}/cloudflare-tunnel \
            -DMACHINEBRIDGE_ENABLE_TUNNEL=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DMACHINEBRIDGE_STATIC_RUNTIME=ON \
            -DCLOUDFLARE_TUNNEL_DIR=${{ github.workspace }}/cloudflare-tunnel \
            -DMACHINEBRIDGE_ENABLE_TUNNEL=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Strip Debug Symbols (Linux)
        if: runner.os == 'Linux'
        run: |
          strip --strip-all build/${{ matrix.artifact_server }}
          strip --strip-all build/${{ matrix.artifact_cli }}

      - name: Stage Artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp build/Release/${{ matrix.artifact_server }} dist/${{ matrix.release_server }}
            cp build/Release/${{ matrix.artifact_cli }} dist/${{ matrix.release_cli }}
          else
            cp build/${{ matrix.artifact_server }} dist/${{ matrix.release_server }}
            cp build/${{ matrix.artifact_cli }} dist/${{ matrix.release_cli }}
          fi

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*

  build-android:
    name: Build Android (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout machinebridge
        uses: actions/checkout@v4

      - name: Checkout cloudflare-tunnel
        uses: actions/checkout@v4
        with:
          repository: chahakshahcs5/cloudflare-tunnel-cpp
          path: cloudflare-tunnel

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c

      - name: Configure Android NDK Build
        run: |
          cmake -B build-android -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLOUDFLARE_TUNNEL_DIR=${{ github.workspace }}/cloudflare-tunnel \
            -DMACHINEBRIDGE_ENABLE_TUNNEL=ON

      - name: Build Standalone Binary & Shared Library
        run: |
          ninja -C build-android machinebridge_server machinebridge_shared

      - name: Strip Symbols
        run: |
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all build-android/machinebridge-server
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded build-android/libmachinebridge.so

      - name: Stage Android Artifacts
        run: |
          mkdir -p dist
          cp build-android/machinebridge-server dist/machinebridge-server-android-arm64
          cp build-android/libmachinebridge.so dist/libmachinebridge-android-arm64.so

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all staged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
